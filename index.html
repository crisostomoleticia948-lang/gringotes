<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gringotes Pro - Gestão Mágica</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg: #0b0a0f; --bg-soft: #13111a; --paper: #1a1624;
            --ink: #efe9ff; --muted: #b9a7df; --accent: #d4b66b;
            --success: #3e9c5b; --danger: #c04848;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Spectral', serif; background-color: var(--bg); color: var(--ink); display: flex; min-height: 100vh; overflow-x: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: linear-gradient(180deg, #161325, #100e1a); border-right: 1px solid #2a2439; padding: 25px; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
        .main { margin-left: 260px; flex: 1; padding: 30px; width: calc(100% - 260px); }

        .nav-item { padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: var(--paper); border-color: var(--accent); color: var(--accent); }

        /* Cards */
        .card { background: var(--paper); border: 1px solid #2a2439; border-radius: 15px; padding: 20px; margin-bottom: 25px; }
        .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .grid-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .kpi { text-align: center; }
        .kpi h3 { font-size: 11px; color: var(--muted); margin: 0; text-transform: uppercase; }
        .kpi p { font-size: 1.3rem; font-weight: bold; margin: 8px 0 0 0; font-family: 'Cinzel'; }

        input, select { width: 100%; background: #0b0a0f; border: 1px solid #3b3251; color: white; padding: 10px; border-radius: 8px; margin-top: 5px; }
        .btn { background: var(--accent); color: #1a1624; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cinzel'; width: 100%; margin-top: 10px; }
        .btn.secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); margin-top: 20px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--muted); border-bottom: 2px solid #2a2439; }
        td { padding: 12px; border-bottom: 1px solid #2a2439; }
        
        .tag { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .tag.entrada { background: var(--success); }
        .tag.saida { background: var(--danger); }
        .tag.pendente { border: 1px solid #ffa500; color: #ffa500; }

        .is-hidden { display: none; }
        canvas { max-width: 100% !important; height: auto !important; }

        @media (max-width: 900px) {
            .sidebar { width: 70px; padding: 10px; }
            .main { margin-left: 70px; width: calc(100% - 70px); }
            .nav-text, #house-name, .sidebar h2 { display: none; }
            .grid-charts { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="font-family: 'Cinzel'; color: var(--accent);">GRINGOTES</h2>
        <nav style="margin-top: 20px;">
            <div class="nav-item active" onclick="showView('dashboard')">🏰 <span class="nav-text">Salão Comunal</span></div>
            <div class="nav-item" onclick="showView('transacoes')">📜 <span class="nav-text">Lançamentos</span></div>
            <div class="nav-item" onclick="showView('perfil')">🧙 <span class="nav-text">Perfil</span></div>
        </nav>
        <button class="btn secondary" onclick="exportarExcel()">📜 Pergaminho</button>
        <div style="margin-top: auto; text-align: center;">
            <span id="house-icon" style="font-size: 30px;">🦁</span>
            <p id="house-name" style="font-size: 12px; font-family: 'Cinzel';"></p>
        </div>
    </aside>

    <main class="main">
        <section id="view-dashboard">
            <h1 id="greeting" style="font-family: 'Cinzel';">Cofre de Bruxo</h1>
            <div class="grid-kpi">
                <div class="card kpi"><h3>Entradas</h3><p id="kpi-ent" style="color: var(--success);"></p></div>
                <div class="card kpi"><h3>Saídas</h3><p id="kpi-sai" style="color: var(--danger);"></p></div>
                <div class="card kpi"><h3>Saldo</h3><p id="kpi-bal"></p></div>
            </div>
            <div class="grid-charts">
                <div class="card"><canvas id="chartBal"></canvas></div>
                <div class="card"><canvas id="chartCat"></canvas></div>
            </div>
        </section>

        <section id="view-transacoes" class="is-hidden">
            <div class="card">
                <form id="f-trans" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;">
                    <input type="text" id="f-desc" placeholder="Descrição" required>
                    <select id="f-cat">
                        <option value="Habitação">Beco Diagonal (Casa)</option>
                        <option value="Academia">Quadribol (Academia)</option>
                        <option value="Saúde">St. Mungus (Saúde)</option>
                        <option value="Educação">Hogwarts (Ensino)</option>
                        <option value="Lazer">Hogsmeade (Lazer)</option>
                    </select>
                    <input type="number" id="f-val" step="0.01" placeholder="Valor (G)" required>
                    <select id="f-tipo"><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
                    <select id="f-stat"><option value="pago">Pago</option><option value="pendente">Pendente</option></select>
                    <button class="btn">Lançar ✨</button>
                </form>
            </div>
            <div class="card">
                <table id="t-dados">
                    <thead><tr><th>Data</th><th>Desc</th><th>Galeões</th><th>Status</th><th>Ação</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section id="view-perfil" class="is-hidden">
            <div class="card" style="max-width: 400px;">
                <h2>Perfil</h2>
                <input type="text" id="p-nome" placeholder="Seu Nome">
                <select id="p-casa" style="margin-top:10px;">
                    <option value="Gryffindor">Gryffindor</option>
                    <option value="Slytherin">Slytherin</option>
                    <option value="Ravenclaw">Ravenclaw</option>
                    <option value="Hufflepuff">Hufflepuff</option>
                </select>
                <button class="btn" onclick="savePerfil()">Salvar</button>
            </div>
        </section>
    </main>

    <script>
        let dados = JSON.parse(localStorage.getItem('gr_db') || '{"t":[], "u":{"n":"Bruxo","c":"Gryffindor"}}');
        let c1 = null, c2 = null;

        function toWizard(v) {
            let val = Math.abs(v);
            let g = Math.floor(val);
            let s = Math.floor((val - g) * 17);
            let n = Math.round(((val - g) * 17 - s) * 29);
            return `${v<0?'-':''}${g}G ${s}S ${n}N`;
        }

        function showView(v) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('is-hidden'));
            document.getElementById('view-' + v).classList.remove('is-hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(event) event.currentTarget.classList.add('active');
            update();
        }

        function savePerfil() {
            dados.u.n = document.getElementById('p-nome').value;
            dados.u.c = document.getElementById('p-casa').value;
            localStorage.setItem('gr_db', JSON.stringify(dados));
            apply();
            alert("Perfil salvo!");
        }

        function apply() {
            const th = {
                'Gryffindor': { a: '#e3a000', b: '#740001', i: '🦁' },
                'Slytherin': { a: '#2a623d', b: '#1a472a', i: '🐍' },
                'Ravenclaw': { a: '#946b2d', b: '#0e1a40', i: '🦅' },
                'Hufflepuff': { a: '#372e29', b: '#ecb939', i: '🦡' }
            };
            const t = th[dados.u.c];
            document.documentElement.style.setProperty('--accent', t.a);
            document.getElementById('house-icon').textContent = t.i;
            document.getElementById('house-name').textContent = dados.u.c;
            document.getElementById('greeting').textContent = "Cofre de " + dados.u.n;
        }

        function update() {
            let ent = 0, sai = 0, cats = {};
            const tbody = document.querySelector('#t-dados tbody');
            tbody.innerHTML = '';

            dados.t.forEach((item, i) => {
                let v = parseFloat(item.val);
                if(item.tipo === 'entrada') ent += v;
                else {
                    sai += v;
                    cats[item.cat] = (cats[item.cat] || 0) + v;
                }
                tbody.innerHTML += `<tr>
                    <td>${item.d}</td><td>${item.desc}</td>
                    <td>${toWizard(v)}</td>
                    <td><span class="tag ${item.stat}">${item.stat}</span></td>
                    <td><button onclick="del(${i})" style="background:none; border:none; color:red; cursor:pointer;">❌</button></td>
                </tr>`;
            });

            document.getElementById('kpi-ent').textContent = toWizard(ent);
            document.getElementById('kpi-sai').textContent = toWizard(sai);
            document.getElementById('kpi-bal').textContent = toWizard(ent - sai);

            render(ent, sai, cats);
        }

        function render(e, s, cts) {
            if(c1) c1.destroy(); if(c2) c2.destroy();
            c1 = new Chart(document.getElementById('chartBal'), {
                type: 'doughnut',
                data: { labels: ['Entradas', 'Saídas'], datasets: [{ data: [e, s], backgroundColor: ['#3e9c5b', '#c04848'] }] },
                options: { plugins: { legend: { labels: { color: '#fff' } } } }
            });
            c2 = new Chart(document.getElementById('chartCat'), {
                type: 'bar',
                data: { labels: Object.keys(cts), datasets: [{ label: 'Gastos por Categoria', data: Object.values(cts), backgroundColor: '#d4b66b' }] },
                options: { indexAxis: 'y', scales: { x: { ticks: { color: '#fff' } }, y: { ticks: { color: '#fff' } } } }
            });
        }

        function del(i) { dados.t.splice(i, 1); localStorage.setItem('gr_db', JSON.stringify(dados)); update(); }

        document.getElementById('f-trans').onsubmit = (e) => {
            e.preventDefault();
            dados.t.push({
                d: new Date().toLocaleDateString('pt-BR'),
                desc: document.getElementById('f-desc').value,
                cat: document.getElementById('f-cat').value,
                val: document.getElementById('f-val').value,
                tipo: document.getElementById('f-tipo').value,
                stat: document.getElementById('f-stat').value
            });
            localStorage.setItem('gr_db', JSON.stringify(dados));
            update(); e.target.reset();
        };

        function exportarExcel() {
            const ws = XLSX.utils.json_to_sheet(dados.t);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Gringotes");
            XLSX.writeFile(wb, "Pergaminho_Financeiro.xlsx");
        }

        apply(); update();
        document.getElementById('p-nome').value = dados.u.n;
        document.getElementById('p-casa').value = dados.u.c;
    </script>
</body>
</html>
