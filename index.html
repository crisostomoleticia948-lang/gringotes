<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gringotes - Controle de Finanças Mágico</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0a0f;
            --bg-soft: #13111a;
            --paper: #1a1624;
            --ink: #efe9ff;
            --muted: #b9a7df;
            --accent: #d4b66b;
            --success: #3e9c5b;
            --danger: #c04848;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Spectral', serif; background-color: var(--bg); color: var(--ink); display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 280px; background: linear-gradient(180deg, #161325, #100e1a); border-right: 1px solid #2a2439; padding: 25px; display: flex; flex-direction: column; position: fixed; height: 100vh; }
        .main { margin-left: 280px; flex: 1; padding: 30px; }

        .nav-item { padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: var(--paper); border-color: var(--accent); color: var(--accent); }

        /* Cards */
        .card { background: var(--paper); border: 1px solid #2a2439; border-radius: 15px; padding: 20px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        
        .kpi h3 { font-size: 14px; color: var(--muted); margin: 0; text-transform: uppercase; }
        .kpi p { font-size: 22px; font-weight: bold; margin: 10px 0 0 0; font-family: 'Cinzel'; }

        /* Forms */
        input, select, textarea { width: 100%; background: #0b0a0f; border: 1px solid #3b3251; color: white; padding: 12px; border-radius: 8px; margin-top: 5px; font-family: 'Spectral'; }
        .btn { background: var(--accent); color: #1a1624; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cinzel'; width: 100%; margin-top: 15px; }
        .btn:hover { filter: brightness(1.2); }

        /* Tabela e Tags */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 12px; color: var(--muted); border-bottom: 2px solid #2a2439; }
        td { padding: 12px; border-bottom: 1px solid #2a2439; }
        .tag { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .tag.entrada { background: var(--success); }
        .tag.saida { background: var(--danger); }
        .tag.pendente { border: 1px solid #ffa500; color: #ffa500; }

        .is-hidden { display: none; }
        #chart-container { max-width: 400px; margin: 0 auto; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="font-family: 'Cinzel'; color: var(--accent);">GRINGOTES</h2>
        <nav style="margin-top: 30px;">
            <div class="nav-item active" onclick="showView('dashboard')">🏰 Salão Comunal</div>
            <div class="nav-item" onclick="showView('transacoes')">📜 Lançamentos</div>
            <div class="nav-item" onclick="showView('perfil')">🧙 Perfil do Bruxo</div>
        </nav>
        <div id="house-display" style="margin-top: auto; text-align: center; border-top: 1px solid #2a2439; padding-top: 20px;">
            <span id="house-icon" style="font-size: 40px;">🦁</span>
            <p id="house-name" style="font-family: 'Cinzel';">Gryffindor</p>
        </div>
    </aside>

    <main class="main">
        <section id="view-dashboard">
            <h1 style="font-family: 'Cinzel';">Bem-vindo, <span id="user-greeting">Bruxo</span></h1>
            <div class="grid">
                <div class="card kpi"><h3>Entradas</h3><p id="total-entradas" style="color: var(--success);">0G 0S 0N</p></div>
                <div class="card kpi"><h3>Saídas</h3><p id="total-saidas" style="color: var(--danger);">0G 0S 0N</p></div>
                <div class="card kpi"><h3>Pendências</h3><p id="total-pendente" style="color: #ffa500;">0G 0S 0N</p></div>
                <div class="card kpi"><h3>Saldo Real</h3><p id="total-saldo">0G 0S 0N</p></div>
            </div>
            <div class="card" id="chart-container">
                <canvas id="financeChart"></canvas>
            </div>
        </section>

        <section id="view-transacoes" class="is-hidden">
            <div class="card">
                <h2 style="font-family: 'Cinzel';">Novo Lançamento</h2>
                <form id="finance-form" class="grid">
                    <div><label>Descrição</label><input type="text" id="desc" required></div>
                    <div><label>Valor (Galeões)</label><input type="number" id="val" step="0.01" required></div>
                    <div><label>Tipo</label><select id="tipo"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></div>
                    <div><label>Status</label><select id="status"><option value="pago">Pago/Recebido</option><option value="pendente">Pendente</option></select></div>
                    <div style="grid-column: span 2;"><button type="submit" class="btn">Registrar no Cofre</button></div>
                </form>
            </div>
            <div class="card">
                <h2 style="font-family: 'Cinzel';">Histórico</h2>
                <table>
                    <thead><tr><th>Descrição</th><th>Valor</th><th>Tipo</th><th>Status</th><th>Ação</th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </section>

        <section id="view-perfil" class="is-hidden">
            <div class="card">
                <h2 style="font-family: 'Cinzel';">Alterar Identidade</h2>
                <form id="profile-form">
                    <label>Seu Nome</label><input type="text" id="user-name">
                    <label style="margin-top: 15px; display: block;">Casa de Hogwarts</label>
                    <select id="user-house">
                        <option value="Gryffindor">Gryffindor 🦁</option>
                        <option value="Slytherin">Slytherin 🐍</option>
                        <option value="Ravenclaw">Ravenclaw 🦅</option>
                        <option value="Hufflepuff">Hufflepuff 🦡</option>
                    </select>
                    <button type="submit" class="btn">Atualizar Perfil</button>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let db = JSON.parse(localStorage.getItem('gringotes_db')) || { transacoes: [], user: { nome: "Bruxo", casa: "Gryffindor" } };
        let myChart = null;

        function save() { localStorage.setItem('gringotes_db', JSON.stringify(db)); }

        function formatMoeda(v) {
            let g = Math.floor(v);
            let s = Math.floor((v - g) * 17);
            let n = Math.round(((v - g) * 17 - s) * 29);
            return `${g}G ${s}S ${n}N`;
        }

        function showView(view) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('is-hidden'));
            document.getElementById('view-' + view).classList.remove('is-hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(view === 'dashboard') updateDashboard();
        }

        function applyTheme() {
            const houses = {
                'Gryffindor': { accent: '#e3a000', color: '#740001', icon: '🦁' },
                'Slytherin': { accent: '#2a623d', color: '#1a472a', icon: '🐍' },
                'Ravenclaw': { accent: '#946b2d', color: '#0e1a40', icon: '🦅' },
                'Hufflepuff': { accent: '#372e29', color: '#ecb939', icon: '🦡' }
            };
            const h = houses[db.user.casa];
            document.documentElement.style.setProperty('--accent', h.accent);
            document.getElementById('house-icon').textContent = h.icon;
            document.getElementById('house-name').textContent = db.user.casa;
            document.getElementById('user-greeting').textContent = db.user.nome;
        }

        function updateDashboard() {
            let ent = 0, sai = 0, pend = 0;
            db.transacoes.forEach(t => {
                let v = parseFloat(t.valor);
                if(t.status === 'pendente') pend += v;
                else if(t.tipo === 'entrada') ent += v;
                else sai += v;
            });

            document.getElementById('total-entradas').textContent = formatMoeda(ent);
            document.getElementById('total-saidas').textContent = formatMoeda(sai);
            document.getElementById('total-pendente').textContent = formatMoeda(pend);
            document.getElementById('total-saldo').textContent = formatMoeda(ent - sai);
            renderChart(ent, sai);
        }

        function renderChart(e, s) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Entradas', 'Saídas'],
                    datasets: [{ data: [e, s], backgroundColor: ['#3e9c5b', '#c04848'], borderWeight: 0 }]
                },
                options: { plugins: { legend: { labels: { color: '#fff' } } } }
            });
        }

        function renderTable() {
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            db.transacoes.forEach((t, i) => {
                body.innerHTML += `
                    <tr>
                        <td>${t.desc}</td>
                        <td>${formatMoeda(t.valor)}</td>
                        <td><span class="tag ${t.tipo}">${t.tipo}</span></td>
                        <td><span class="tag ${t.status}">${t.status}</span></td>
                        <td><button onclick="deleteTrans(${i})" style="background:none; border:none; color:red; cursor:pointer;">❌</button></td>
                    </tr>`;
            });
        }

        function deleteTrans(i) { db.transacoes.splice(i, 1); save(); renderTable(); updateDashboard(); }

        document.getElementById('finance-form').onsubmit = (e) => {
            e.preventDefault();
            db.transacoes.push({
                desc: document.getElementById('desc').value,
                valor: document.getElementById('val').value,
                tipo: document.getElementById('tipo').value,
                status: document.getElementById('status').value
            });
            save(); renderTable(); e.target.reset(); alert("Registrado em Gringotes!");
        };

        document.getElementById('profile-form').onsubmit = (e) => {
            e.preventDefault();
            db.user.nome = document.getElementById('user-name').value;
            db.user.casa = document.getElementById('user-house').value;
            save(); applyTheme(); alert("Perfil atualizado pelo Ministério!");
        };

        // Init
        applyTheme();
        updateDashboard();
        renderTable();
        document.getElementById('user-name').value = db.user.nome;
        document.getElementById('user-house').value = db.user.casa;
    </script>
</body>
</html>
