<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gringotes Pro - Gestão de Ativos Bruxos</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg: #0b0a0f; --bg-soft: #13111a; --paper: #1a1624;
            --ink: #efe9ff; --muted: #b9a7df; --accent: #d4b66b;
            --success: #3e9c5b; --danger: #c04848;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { margin: 0; font-family: 'Spectral', serif; background-color: var(--bg); color: var(--ink); display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: linear-gradient(180deg, #161325, #100e1a); border-right: 1px solid #2a2439; padding: 25px; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
        .main { margin-left: 260px; flex: 1; padding: 30px; }

        .nav-item { padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; }
        .nav-item:hover, .nav-item.active { background: var(--paper); border-color: var(--accent); color: var(--accent); }

        .card { background: var(--paper); border: 1px solid #2a2439; border-radius: 15px; padding: 20px; margin-bottom: 25px; }
        .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .grid-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .kpi { text-align: center; }
        .kpi h3 { font-size: 12px; color: var(--muted); margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .kpi p { font-size: 1.4rem; font-weight: bold; margin: 8px 0 0 0; font-family: 'Cinzel'; }

        input, select { width: 100%; background: #0b0a0f; border: 1px solid #3b3251; color: white; padding: 10px; border-radius: 8px; margin-top: 5px; font-family: 'Spectral'; }
        .btn { background: var(--accent); color: #1a1624; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cinzel'; width: 100%; margin-top: 10px; }
        .btn.secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); margin-top: 20px; }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--muted); border-bottom: 2px solid #2a2439; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid #2a2439; font-size: 14px; }
        
        .tag { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .tag.entrada { background: var(--success); }
        .tag.saida { background: var(--danger); }
        .tag.pendente { border: 1px solid #ffa500; color: #ffa500; }

        .is-hidden { display: none; }
        @media (max-width: 900px) { .grid-charts { grid-template-columns: 1fr; } .sidebar { width: 80px; } .main { margin-left: 80px; } .nav-text, #house-name { display: none; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="font-family: 'Cinzel'; color: var(--accent); font-size: 18px;">GRINGOTES</h2>
        <nav style="margin-top: 30px;">
            <div class="nav-item active" onclick="showView('dashboard')">🏰 <span class="nav-text">Salão Comunal</span></div>
            <div class="nav-item" onclick="showView('transacoes')">📜 <span class="nav-text">Lançamentos</span></div>
            <div class="nav-item" onclick="showView('perfil')">🧙 <span class="nav-text">Perfil do Bruxo</span></div>
        </nav>
        
        <button class="btn secondary" onclick="exportarPergaminho()">📜 Exportar Pergaminho</button>

        <div id="house-display" style="margin-top: auto; text-align: center; border-top: 1px solid #2a2439; padding-top: 20px;">
            <span id="house-icon" style="font-size: 40px;">🦁</span>
            <p id="house-name" style="font-family: 'Cinzel'; font-size: 12px;"></p>
        </div>
    </aside>

    <main class="main">
        <section id="view-dashboard">
            <h1 style="font-family: 'Cinzel'; margin-bottom: 5px;">Cofre de <span id="user-greeting">Bruxo</span></h1>
            <p style="color: var(--muted);
